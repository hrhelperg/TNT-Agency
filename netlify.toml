[build]
  command = "npm install && npm run build"
  # Publish the Next.js build output (NOT the repo root). Without this Netlify
  # defaulted publish to the base dir, which served static root HTML and made
  # @netlify/plugin-nextjs fail ("publish directory cannot be the base directory").
  publish = ".next"

# Serve the Next.js app via the Netlify Next.js runtime (SSR/SSG pages, public/
# static assets at the web root, and API routes such as /api/send-email as
# functions). Without this the site was published as static repo-root HTML and
# Next routes (e.g. the calculator) were not served.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ──────────────────────────────────────────────
# Canonical host: talentpartnerid.com
# Permanent, path-preserving 301 redirects from every legacy host and from the
# www subdomain of the new domain. Netlify appends the original query string
# automatically. The apex talentpartnerid.com is intentionally NOT redirected
# (no self-redirect / loop), and each source points directly to the apex
# (single hop, no chains).
# ──────────────────────────────────────────────

# Legacy primary domain (current) → new canonical
[[redirects]]
  from   = "https://manpower-tnt.agency/*"
  to     = "https://talentpartnerid.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.manpower-tnt.agency/*"
  to     = "https://talentpartnerid.com/:splat"
  status = 301
  force  = true

# Legacy no-hyphen variant → new canonical
[[redirects]]
  from   = "https://manpowertnt.agency/*"
  to     = "https://talentpartnerid.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.manpowertnt.agency/*"
  to     = "https://talentpartnerid.com/:splat"
  status = 301
  force  = true

# Legacy tntgency.org → new canonical
[[redirects]]
  from   = "https://tntgency.org/*"
  to     = "https://talentpartnerid.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.tntgency.org/*"
  to     = "https://talentpartnerid.com/:splat"
  status = 301
  force  = true

# www of the new domain → apex canonical
[[redirects]]
  from   = "https://www.talentpartnerid.com/*"
  to     = "https://talentpartnerid.com/:splat"
  status = 301
  force  = true

# ──────────────────────────────────────────────
# Canonical path consolidation (single-hop, permanent).
# The English privacy policy is served once, at the Next route /privacy-policy.
# The legacy static /privacy.html duplicate was removed; this redirect preserves
# any external links to it and prevents a duplicate EN privacy URL in Search.
# (Czech and German privacy remain at /privacy-cs.html and /privacy-de.html.)
# ──────────────────────────────────────────────
[[redirects]]
  from   = "/privacy.html"
  to     = "/privacy-policy"
  status = 301
  force  = true

# ──────────────────────────────────────────────
# TalentPartnerID Media — proxied from its own deployment.
#
# The publication is a separate Astro site with its own repository and its own
# Netlify build (hrhelperg/talentpartnerid-media), so publishing an article
# does not rebuild this one. These six rules put it on this domain without
# merging the two codebases.
#
# ORDER IS LOAD-BEARING. These rules are host-agnostic and first-match-wins, so
# they MUST stay below all seven host-canonicalization 301s above. Placed above
# them, /media/* would capture every legacy hostname — manpower-tnt.agency,
# manpowertnt.agency, tntgency.org, their www variants and www.talentpartnerid
# .com — and serve the publication with 200 on six hosts that exist only to
# redirect away. One misplaced block, six duplicate origins.
#
# Three exact-match rules and three splat rules, one pair per locale prefix.
# The exact rules are not redundant: Netlify normalizes trailing slashes before
# matching, but declaring both costs nothing and removes a dependency on
# behaviour that cannot be tested locally.
#
# The path is identical on both sides, which is why :splat is a straight
# pass-through and the origin's asset URLs are already correct. Netlify does
# not rewrite response bodies, so a root-mounted origin would need a <base>
# tag and would be strictly worse.
#
# NOT a Netlify Function: scripts/security-check.js asserts netlify/functions
# and pages/api do not exist, and the backend-free posture is deliberate.
#
# force = true matches the house style above and, more importantly, means these
# three prefixes are now permanently reserved — a future Next page under
# /media, /en/media or /de/media would be shadowed silently. See
# scripts/validate-media-proxy.mjs, which fails the build if that happens.
# ──────────────────────────────────────────────
[[redirects]]
  from   = "/media"
  to     = "https://talentpartnerid-media.netlify.app/media"
  status = 200
  force  = true

[[redirects]]
  from   = "/media/*"
  to     = "https://talentpartnerid-media.netlify.app/media/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/en/media"
  to     = "https://talentpartnerid-media.netlify.app/en/media"
  status = 200
  force  = true

[[redirects]]
  from   = "/en/media/*"
  to     = "https://talentpartnerid-media.netlify.app/en/media/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/de/media"
  to     = "https://talentpartnerid-media.netlify.app/de/media"
  status = 200
  force  = true

[[redirects]]
  from   = "/de/media/*"
  to     = "https://talentpartnerid-media.netlify.app/de/media/:splat"
  status = 200
  force  = true

[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
